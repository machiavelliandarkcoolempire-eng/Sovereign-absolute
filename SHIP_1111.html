    <script>
        // ========================================================
        // WEB3 ENGINE (ETHERS.JS)
        // ========================================================
        const LOCKED_TOKEN_ID = 1111;
        const LOCKED_SHIP_INDEX = 0;
        const SOVEREIGN_ABI = [
            "function ownerOf(uint256 tokenId) view returns (address)",
            "function SOVEREIGNTY_COUNCIL(uint256 tokenId) view returns (bool)",
            "function getDeedData(uint256 t) view returns (address sovereignOwner, bool sovereignActive, bool absoluteSovereigntyStatus, string sovereignFront, string sovereignBack, string sovereignVideo, string sovereignIdentity, string sovereignHidden, address sovereignTba)"
        ];

        async function fetchSmartContractData(contractAddress, tokenId) {
    const cleanAddr = (contractAddress || '').trim();
    const cleanTokenId = String(LOCKED_TOKEN_ID);

    if (!cleanAddr || !ethers.isAddress(cleanAddr)) {
        showToast("ERROR: Invalid Contract Address");
        return;
    }
    if (!cleanTokenId || isNaN(cleanTokenId)) {
        showToast("ERROR: Invalid Token ID");
        return;
    }

    showToast("Connecting to Base Mainnet...");
    
    try {
        const provider = new ethers.JsonRpcProvider("https://mainnet.base.org");
        const contract = new ethers.Contract(cleanAddr, SOVEREIGN_ABI, provider);

        // ดึงข้อมูล 9 พารามิเตอร์จาก getDeedData ใน Smart Contract
        const deedData = await contract.getDeedData(cleanTokenId);
        
        const ownerAddress = deedData[0] || null;          // sovereignOwner
        const isActive = deedData[1];                      // sovereignActive
        const isAbsoluteSovereign = deedData[2];           // absoluteSovereigntyStatus
        const dnaString = deedData[6] || "";               // sovereignIdentity
        const tbaAddress = deedData[8] || null;            // sovereignTba (Index 8)

        // สแกนดึงยอดคงเหลือ ETH ในคลัง TBA (ERC-6551)
        let tbaBalanceEth = "0.0000";
        if (tbaAddress && tbaAddress !== ethers.ZeroAddress) {
            try {
                const balanceWei = await provider.getBalance(tbaAddress);
                tbaBalanceEth = parseFloat(ethers.formatEther(balanceWei)).toFixed(4);
            } catch (balanceErr) {
                console.warn("TBA Balance Fetch Warning:", balanceErr);
            }
        }

        // getTBA() in the contract returns the *computed* address even before deployTBA() runs,
        // so deployment is detected by checking for bytecode at that address.
        let tbaDeployed = false;
        if (tbaAddress && tbaAddress !== ethers.ZeroAddress) {
            try {
                const tbaCode = await provider.getCode(tbaAddress);
                tbaDeployed = !!tbaCode && tbaCode !== '0x';
            } catch (codeErr) {
                console.warn("TBA Code Check Warning:", codeErr);
            }
        }
        let isCouncil = false;
        try {
            isCouncil = !!(await contract.SOVEREIGNTY_COUNCIL(cleanTokenId));
        } catch (councilErr) {
            console.warn("Council Check Warning:", councilErr);
        }

        if (ownerAddress && ownerAddress.length >= 10) {
            showToast(`Owner Verified: ${ownerAddress.substring(0, 6)}...`);
        }

        state.contractAddress = cleanAddr;
        state.tokenId = cleanTokenId;
        state.isSovereign = !!isAbsoluteSovereign;   // visual only
        state.tbaBalance = parseFloat(tbaBalanceEth) || 0; // visual only

        // FNV-1a Hash Calculation
        const seedText = dnaString.length > 0 ? dnaString : `${cleanAddr.toLowerCase()}:${cleanTokenId}`;
        let tokenSeed = 2166136261;
        for (let i = 0; i < seedText.length; i++) {
            tokenSeed = Math.imul(tokenSeed ^ seedText.charCodeAt(i), 16777619);
        }
        tokenSeed >>>= 0;
        
        // Synchronize State
        state.nftSeed = tokenSeed;
        state.shipSeed = tokenSeed;
        state.worldSeed = tokenSeed;

        // เปลี่ยนสีไฟไอพ่นตามสถานะ Absolute Sovereign / Active
        if (isAbsoluteSovereign) {
            state.engineColor = 0xffd700; // สีทองสำหรับ Sovereign
        } else if (!isActive) {
            state.engineColor = 0x8b1a1a; // แดงหรี่สำหรับยานที่ไม่ Active (มองเห็นได้บนพื้นดำ)
        }

        // Rebuild Environment & Render Ship
        rebuildEnvironmentForSector(tokenSeed);
        renderSelectedShipModel(state.activeShipIndex);
        
        // อัปเดต UI พร้อมข้อมูล TBA Treasury
        updateOnChainUI(ownerAddress, tbaAddress, isAbsoluteSovereign, tbaBalanceEth, isActive, tbaDeployed, isCouncil);
        
        showToast("On-Chain & TBA Data Synced");

    } catch (error) {
        console.error("Web3 Error:", error);
        showToast("ERROR: Token not found or Network issue");
    }
}

        function updateOnChainUI(ownerAddress = null, tbaAddress = null, isAbsolute = false, tbaBalanceEth = "0.0000", isActive = true, tbaDeployed = true, isCouncil = false) {
    const container = document.getElementById('onchain-traits-container');
    if (!container) return;

    if (state.contractAddress && state.tokenId) {
        const activeSeed = state.nftSeed !== null ? state.nftSeed : state.worldSeed;
        
        let ownerHtml = '';
        if (ownerAddress && ownerAddress.length >= 42) {
            ownerHtml = `
                <div class="flex justify-between items-center bg-slate-900/50 px-2 py-1 rounded mt-1">
                    <span class="text-slate-400">OWNER:</span>
                    <span class="text-cyan-300 font-bold text-[9px]">${ownerAddress.substring(0, 6)}...${ownerAddress.substring(38)}</span>
                </div>
            `;
        }

        // ส่วนแสดงผลข้อมูล TBA Vault & ETH Balance
        let tbaHtml = '';
        if (tbaAddress && tbaAddress !== ethers.ZeroAddress) {
            tbaHtml = `
                <div class="bg-cyan-950/60 border border-cyan-500/30 p-2 rounded-lg mt-2 space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-cyan-400 font-bold text-[10px] flex items-center gap-1">
                            <i class="fa-solid fa-vault text-amber-400"></i> ${tbaDeployed ? 'TBA TREASURY' : 'TBA RESERVED'}
                        </span>
                        <span class="text-emerald-400 font-bold font-mono text-[11px]">${tbaBalanceEth} ETH</span>
                    </div>
                    <div class="flex justify-between items-center pt-0.5 border-t border-cyan-900/50">
                        <span class="text-slate-400 text-[9px]">${tbaDeployed ? 'VAULT ADDR:' : 'NOT DEPLOYED:'}</span>
                        <span class="text-slate-300 font-mono text-[9px]">${tbaAddress.substring(0, 6)}...${tbaAddress.substring(38)}</span>

        function createSeededRandom(seed) {
            let value = seed >>> 0;
            return function() {
                value += 0x6D2B79F5;
                let t = value;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function randomBetween(random, min, max) {
            return min + random() * (max - min);
        }

        function deriveSceneSeed(baseSeed, namespace) {
            let hash = (baseSeed >>> 0) || 2166136261;
            const text = String(namespace);
            for (let i = 0; i < text.length; i++) {
                hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
            }
            return hash >>> 0;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function createStarfield() {
            const random = createSeededRandom(state.worldSeed + 11);
            const starGeometry = new THREE.BufferGeometry();
            const starCount = isMobileView ? 2500 : 5000;
            const starPositions = new Float32Array(starCount * 3);
            const starPhases = new Float32Array(starCount);
            const starSizes = new Float32Array(starCount);
            const starColors = new Float32Array(starCount * 3);
            const palette = SECTOR_CONFIGS[state.sector].palette.map(color => new THREE.Color(color));

            for (let i = 0; i < starCount; i++) {
                const r = randomBetween(random, 350, 950);
                const theta = random() * 2 * Math.PI;
                const phi = Math.acos(2 * random() - 1);
                
                starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPositions[i * 3 + 2] = r * Math.cos(phi);
                starPhases[i] = random() * Math.PI * 2;
                starSizes[i] = randomBetween(random, 0.6, 1.8);
                const color = palette[Math.floor(random() * palette.length)];
                starColors[i * 3] = color.r;
                starColors[i * 3 + 1] = color.g;
                starColors[i * 3 + 2] = color.b;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            starGeometry.setAttribute('phase', new THREE.BufferAttribute(starPhases, 1));
            starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));
            starGeometry.setAttribute('aColor', new THREE.BufferAttribute(starColors, 3));

            state.starMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    beat: { value: 0 },
                    pixelRatio: { value: renderer.getPixelRatio() }
                },
                vertexShader: `
                    attribute float phase;
                    attribute float aSize;
                    attribute vec3 aColor;
                    uniform float time;
                    uniform float beat;
                    uniform float pixelRatio;
                    varying float vAlpha;
                    varying vec3 vColor;
                    void main() {
                        vAlpha = min(1.0, 0.45 + 0.55 * abs(sin(time * 0.8 + phase)) + 0.25 * beat);
                        vColor = aColor;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = aSize * pixelRatio * (300.0 / max(80.0, -mvPosition.z)) * (1.0 + 0.35 * beat);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    varying vec3 vColor;
                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;
                        gl_FragColor = vec4(vColor, (0.5 - dist) * 2.0 * vAlpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            state.starField = new THREE.Points(starGeometry, state.starMaterial);
            scene.add(state.starField);
        }

        function createQuantumSlipstream() {
            const config = SECTOR_CONFIGS[state.sector];
            const wormholeColor = config.wormholeColor;
            const random = createSeededRandom(state.worldSeed + 777);
            
            state.wireframeGateway = new THREE.Group();
            const gwGeo = new THREE.CylinderGeometry(40, 40, 200, 32, 20, true);
            const gwMat = new THREE.MeshBasicMaterial({
                color: wormholeColor,
                wireframe: true,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending
            });
            const gwMesh = new THREE.Mesh(gwGeo, gwMat);
            gwMesh.rotation.x = Math.PI / 2;
            state.wireframeGateway.add(gwMesh);
            
            const gwGlowMat = new THREE.MeshBasicMaterial({
                color: config.palette[0],
                transparent: true,
                opacity: 0,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            const gwGlowMesh = new THREE.Mesh(gwGeo, gwGlowMat);
            gwGlowMesh.rotation.x = Math.PI / 2;
            gwGlowMesh.scale.setScalar(0.98);
            state.wireframeGateway.add(gwGlowMesh);
            
            state.wireframeGateway.position.set(0, 0, 3000); 
            scene.add(state.wireframeGateway);

            const rayGeo = new THREE.BufferGeometry();
            const rayCount = 150;
            const rayPos = new Float32Array(rayCount * 2 * 3);
            for(let i=0; i<rayCount; i++) {
                const angle = random() * Math.PI * 2;
                const radius = 15 + random() * 20;
                const zStart = -100 - random() * 200;
                const zEnd = zStart + 50 + random() * 100;
                
                rayPos[i*6] = Math.cos(angle) * radius;
                rayPos[i*6+1] = Math.sin(angle) * radius;
                rayPos[i*6+2] = zStart;
                
                rayPos[i*6+3] = Math.cos(angle) * radius;
                rayPos[i*6+4] = Math.sin(angle) * radius;
                rayPos[i*6+5] = zEnd;
            }
            rayGeo.setAttribute('position', new THREE.BufferAttribute(rayPos, 3));
            const rayMat = new THREE.LineBasicMaterial({
                color: config.palette[1],
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending
            });
            state.slipstreamRays = new THREE.LineSegments(rayGeo, rayMat);
            scene.add(state.slipstreamRays);

            state.slipstreamRings = [];
            for(let i=0; i<8; i++) {
                const ringGeo = new THREE.TorusGeometry(10 + i*3, 0.2, 8, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: config.palette[i % config.palette.length],
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.z = 3000;
                state.slipstreamRings.push(ring);
                scene.add(ring);
            }

            const coreGeo = new THREE.SphereGeometry(8, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
            state.dimensionCore = new THREE.Mesh(coreGeo, coreMat);

                    color: config.palette[i],
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending
                });
                const diskF = new THREE.Mesh(diskGeo, diskMat);
                const diskB = new THREE.Mesh(diskGeo, diskMat);
                state.wormholeFront.add(diskF);
                state.wormholeBack.add(diskB);
            }
            state.wormholeFront.position.set(0, 0, 3000);
            state.wormholeBack.position.set(0, 0, 3000);
            scene.add(state.wormholeFront);
            scene.add(state.wormholeBack);
        }

        function disposeSceneObject(root) {
            if (!root) return;
            scene.remove(root);
            root.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach(material => {
                        if (material.map) material.map.dispose();
                        material.dispose();
                    });
                }
            });
        }

        function rebuildEnvironmentForSector(seedOverride) {
            const roots = [
                state.starField,
                state.stardustField,
                state.squareParticlesField,
                state.nebulaGroup,
                state.wireframeGateway,
                state.slipstreamRays,
                state.dimensionCore,
                state.wormholeFront,
                state.wormholeBack,
                state.instancedAsteroids,
                ...state.slipstreamRings,
                ...state.celestialGroups
            ];
            [...new Set(roots)].forEach(disposeSceneObject);
            
            state.starField = null;
            state.stardustField = null;
            state.squareParticlesField = null;
            state.nebulaGroup = null;
            state.celestialGroups = [];
            state.slipstreamRings = [];
            state.instancedAsteroids = null;
            state.asteroidData = [];
            
            // Deterministic: same base seed -> same world for a given sector (no Math.random here)
            const seedBase = Number.isInteger(seedOverride) ? seedOverride : state.shipSeed;
            state.worldSeed = deriveSceneSeed(seedBase, state.sector);
            state.animRandom = createSeededRandom(state.worldSeed + 8888);

            const config = SECTOR_CONFIGS[state.sector];
            scene.background = new THREE.Color(config.bgColor);
            state.fog.color.setHex(config.fogColor);
            state.fog.density = config.fogDensity;
            state.mainSun.color.setHex(config.sunColor);
            state.fillLight.color.setHex(config.fillColor);
            buildEnvironmentMap();
            
            createStarfield();
            createSoftStardust();
            createSquarePixelParticles();
            createNebulaClouds();
            createRandomizedPlanets();
            createRandomizedAsteroidBelt();
            createQuantumSlipstream();
            
            state.timeSinceLastWarp = 0;
            state.isWormholeActive = false;
            state.isWarping = false;
        }

        function generatePlanetTexture(c1, c2, random) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = `#${c1.getHexString()}`;
            ctx.fillRect(0, 0, 512, 256);
            for (let band = 0; band < 16; band++) {
                const y = random() * 256;
                const h = randomBetween(random, 6, 28);
                ctx.fillStyle = `#${c2.getHexString()}${Math.floor(randomBetween(random, 40, 180)).toString(16).padStart(2, '0')}`;
                ctx.fillRect(0, y, 512, h);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            return tex;
        }

        function generateMoonTexture(random) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8b939c';
            ctx.fillRect(0, 0, 512, 256);

        // 3D SPACE FIGHTER MODEL GENERATOR (5 MODELS: F-22 / SU-57 / PHANTOM / FX-47 / B-9)

        // ---------- Geometry helpers for the fighter models ----------
        function mirrorPts(pts, side) {
            const out = pts.map(([x, z]) => [x * side, z]);
            return side < 0 ? out.reverse() : out;
        }

        // Extrudes a top-down polygon [[x, z], ...] into a thin plate lying in the XZ plane (nose = -Z)
        function addPlanform(pts, thickness, mat, y, edgeColor) {
            const shape = new THREE.Shape();
            pts.forEach(([x, z], i) => { if (i === 0) shape.moveTo(x, -z); else shape.lineTo(x, -z); });
            shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
            geo.rotateX(-Math.PI / 2);
            geo.translate(0, y - thickness / 2, 0);
            const mat2 = mat.clone(); mat2.side = THREE.DoubleSide;
            const mesh = new THREE.Mesh(geo, mat2);
            state.shipGroup.add(mesh);
            if (edgeColor !== undefined) addEdges(geo, new THREE.Vector3(0, 0, 0), null, edgeColor);
            return mesh;
        }

        // Vertical fin from side-profile points [[z, y], ...]; pivot at its base, canted by rotZ
        function addFin(pts, thickness, mat, x, y, z, rotZ, edgeColor) {
            const shape = new THREE.Shape();
            pts.forEach(([zz, yy], i) => { if (i === 0) shape.moveTo(-zz, yy); else shape.lineTo(-zz, yy); });
            shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
            geo.rotateY(Math.PI / 2);
            geo.translate(-thickness / 2, 0, 0);
            const mat2 = mat.clone(); mat2.side = THREE.DoubleSide;
            const mesh = new THREE.Mesh(geo, mat2);
            mesh.position.set(x, y, z);
            mesh.rotation.z = rotZ;
            state.shipGroup.add(mesh);
            if (edgeColor !== undefined) addEdges(geo, mesh.position, mesh.rotation, edgeColor);
            return mesh;
        }

        // Thin glowing panel-line outline (gives the hull a sci-fi / space-craft look)
        function addEdges(geo, pos, rot, color) {
            const lines = new THREE.LineSegments(
                new THREE.EdgesGeometry(geo, 25),
                new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.55 })
            );
            lines.position.copy(pos);
            if (rot) lines.rotation.copy(rot);
            state.shipGroup.add(lines);
        }

        // Digital "pixel" camouflage used by the Su-57
        function makeCamoTexture(rand, baseColor, accent) {
            const size = 32;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            const light = new THREE.Color(0xdfe7f2);
            const mid = baseColor.clone().lerp(new THREE.Color(0x6f89a8), 0.55);
            const dark = new THREE.Color(accent).lerp(new THREE.Color(0x0b1220), 0.72);
            g.fillStyle = '#' + light.getHexString(); g.fillRect(0, 0, size, size);
            for (let y = 0; y < size; y += 2) {
                for (let x = 0; x < size; x += 2) {
                    const r = rand();
                    if (r < 0.38) { g.fillStyle = '#' + mid.getHexString(); g.fillRect(x, y, 2, 2); }
                    else if (r < 0.56) { g.fillStyle = '#' + dark.getHexString(); g.fillRect(x, y, 2, 2); }
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.magFilter = THREE.NearestFilter;
            tex.repeat.set(0.35, 0.35);
            return tex;
        }

        // ---------- Image-based lighting: gives the metal hulls something to reflect ----------
        function buildEnvironmentMap() {
            if (!renderer || !scene) return;
            try {
                const cfg = SECTOR_CONFIGS[state.sector];
                const c = document.createElement('canvas');
                c.width = 512; c.height = 256;
                const g = c.getContext('2d');
                const sky = g.createLinearGradient(0, 0, 0, 256);
                sky.addColorStop(0, '#31487a');
                sky.addColorStop(0.45, '#0d1530');
                sky.addColorStop(1, '#04060d');
                g.fillStyle = sky;
                g.fillRect(0, 0, 512, 256);

                const hex = v => '#' + new THREE.Color(v).getHexString();
                const softbox = (x, y, rx, ry, color, alpha) => {
                    g.save();
                    g.translate(x, y);
                    g.scale(rx, ry);
                    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
                    rg.addColorStop(0, color);
                    rg.addColorStop(1, 'rgba(0,0,0,0)');
                    g.globalAlpha = alpha;
                    g.fillStyle = rg;
                    g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
                    g.restore();
                };
                softbox(130, 60, 90, 34, '#ffffff', 1.0);               // key light
                softbox(60, 80, 70, 40, hex(cfg.sunColor), 0.9);        // sun-coloured kicker
                softbox(330, 100, 80, 36, hex(cfg.palette[0]), 0.95);   // rim A
                softbox(450, 70, 70, 30, hex(cfg.palette[1]), 0.9);     // rim B
                softbox(250, 200, 120, 30, hex(cfg.fillColor), 0.55);   // under-glow
                softbox(256, 20, 160, 18, '#ffffff', 0.7);              // top strip

                const tex = new THREE.CanvasTexture(c);
                tex.mapping = THREE.EquirectangularReflectionMapping;
                if (!state.pmrem) state.pmrem = new THREE.PMREMGenerator(renderer);
                const rt = state.pmrem.fromEquirectangular(tex);
                if (state.envRT) state.envRT.dispose();
                state.envRT = rt;
                scene.environment = rt.texture;
                tex.dispose();
            } catch (err) {
                console.warn('Environment map unavailable:', err);
            }
        }

        // ---------- Serial plate printed on the dorsal tail: shows #TOKEN once a token is synced ----------
        function addSerialPlate(y, z, width, code, edgeColor) {
            const label = state.tokenId ? '#' + String(state.tokenId).slice(0, 10) : code;
            const c = document.createElement('canvas');
            c.width = 320; c.height = 96;
            const g = c.getContext('2d');
            g.fillStyle = 'rgba(4, 8, 18, 0.86)';
            g.fillRect(0, 0, 320, 96);
            g.strokeStyle = '#' + new THREE.Color(edgeColor).getHexString();
            g.lineWidth = 6;
            g.strokeRect(4, 4, 312, 88);
            g.fillStyle = state.isSovereign ? '#ffd700' : '#ffffff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            let size = 54;
            g.font = '800 ' + size + 'px Orbitron, monospace';
            while (g.measureText(label).width > 270 && size > 20) {
                size -= 4;
                g.font = '800 ' + size + 'px Orbitron, monospace';
            }
            g.fillText(label, 160, 50);
            const tex = new THREE.CanvasTexture(c);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
            const plate = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 96 / 320), mat);
            plate.rotation.x = -Math.PI / 2; // faces up, text reads from behind the craft
            plate.position.set(0, y, z);
            state.shipGroup.add(plate);
            return plate;
        }

        function renderSelectedShipModel(index) {
            while (state.shipGroup.children.length > 0) {
                const child = state.shipGroup.children[0];
                state.shipGroup.remove(child);
                child.traverse(node => {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        const materials = Array.isArray(node.material) ? node.material : [node.material];
                        materials.forEach(material => {
                            if (material.map) material.map.dispose();
                            material.dispose();
                        });
                    }
                });
            }

            // The craft's identity depends ONLY on the NFT seed + a fixed palette, never on the sector.
            const traitRandom = createSeededRandom(state.shipSeed + (index + 1) * 977);
            const palette = SECTOR_CONFIGS['deep-space'].palette;
            const hullColor = new THREE.Color(0x172033).lerp(
                new THREE.Color(palette[Math.floor(traitRandom() * palette.length)]),
                randomBetween(traitRandom, 0.12, 0.32)
            );
            const accentColor = palette[Math.floor(traitRandom() * palette.length)];
            const cockpitColor = palette[Math.floor(traitRandom() * palette.length)];
            
            const hullMat = new THREE.MeshStandardMaterial({ color: hullColor, metalness: 0.9, roughness: 0.2 });
            const plateMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.95, roughness: 0.15 });
            const accentMat = new THREE.MeshStandardMaterial({ color: accentColor, metalness: 0.85, roughness: 0.25 });
            const cockpitMat = new THREE.MeshStandardMaterial({
                color: cockpitColor, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.8, emissive: cockpitColor, emissiveIntensity: 0.55
            });
            const coreGlowMat = new THREE.MeshBasicMaterial({ color: cockpitColor });
            state.thrusterMaterial = new THREE.MeshBasicMaterial({ color: state.engineColor, transparent: true, opacity: 0.9 });
            const hotCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
            const missileMat = new THREE.MeshStandardMaterial({ color: 0xcfd8e3, metalness: 0.55, roughness: 0.35 });
            const glowStripMat = new THREE.MeshBasicMaterial({ color: state.isSovereign ? 0xffd700 : accentColor, transparent: true, opacity: 0.9 });

            if (index === 0) {
                // ========================================================
                // MODEL 0: F-22 RAPTOR (Space Superiority Fighter)
                // ========================================================
                const goldCanopy = new THREE.MeshStandardMaterial({
                    color: 0xd9a441, metalness: 0.95, roughness: 0.08,
                    emissive: 0x7a4a00, emissiveIntensity: 0.35, transparent: true, opacity: 0.92
                });
                const edgeCol = accentColor;

                // Fuselage: faceted chine planform
                addPlanform([[0,-4.8],[0.4,-3.2],[0.85,-1.4],[1.0,0.6],[1.0,2.9],[0.7,3.7],
                             [-0.7,3.7],[-1.0,2.9],[-1.0,0.6],[-0.85,-1.4],[-0.4,-3.2]],
                            0.5, plateMat, 0, edgeCol);
                // Raised spine / dorsal deck
                addPlanform([[0,-3.4],[0.45,-1.0],[0.55,2.8],[0.4,3.5],[-0.4,3.5],[-0.55,2.8],[-0.45,-1.0]],
                            0.3, hullMat, 0.2, edgeCol);

                // Bubble canopy
                const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), goldCanopy);
                canopy.scale.set(0.8, 0.55, 2.6);
                canopy.position.set(0, 0.42, -1.5);
                state.shipGroup.add(canopy);

                // Radome tip
                const radome = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.6, 4), plateMat);
                radome.rotation.x = -Math.PI / 2; radome.rotation.z = Math.PI / 4;
                radome.scale.set(1.0, 1.0, 0.55);
                radome.position.set(0, 0, -4.6);
                state.shipGroup.add(radome);

                // --- Detail pass: pitot probe, canopy frame, dorsal airbrake, tail beaver, spine glow ---
                const f22Pitot = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.05, 1.3, 8), accentMat);
                f22Pitot.rotation.x = Math.PI / 2;
                f22Pitot.position.set(0, 0, -5.6);
                state.shipGroup.add(f22Pitot);

                const canopyBow = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.05, 0.08), plateMat);
                canopyBow.position.set(0, 0.56, -2.35);
                state.shipGroup.add(canopyBow);
                const canopyRail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, 2.2), plateMat);
                [-1, 1].forEach(s => {
                    const rail = canopyRail.clone();
                    rail.position.set(s * 0.33, 0.34, -1.5);
                    state.shipGroup.add(rail);
                });

                const airbrake = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.9), accentMat);
                airbrake.position.set(0, 0.38, 2.5);
                state.shipGroup.add(airbrake);

                const spineStrip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 2.0), glowStripMat);
                spineStrip.position.set(0, 0.37, 0.7);

                [-1, 1].forEach(side => {
                    // Chine edge glow strips running along the fuselage nose
                    const chine = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 3.4), glowStripMat);
                    chine.position.set(side * 0.52, 0.26, -2.1);

                    // Wing leading-edge glow line
                    const le = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 3.82), glowStripMat);
                    le.position.set(side * 2.25, 0.05, -0.05);
                    le.rotation.y = side * Math.PI / 4;
                    state.shipGroup.add(le);
                    // Navigation lights on the wingtips (red = port, green = starboard)
                    addNavLight(side * 3.6, 0.06, 1.75, side < 0 ? 0xff2244 : 0x22ff88);
                    // Side-mounted short-range missiles on the intake shoulders
                    addMissile(side * 1.38, -0.3, -0.35, 2.0, missileMat, plateMat);
                    // Control-surface hinge lines on the wings and stabilators
                    const hinge = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.02, 0.04), plateMat);
                    hinge.position.set(side * 2.25, 0.055, 2.3);
                    hinge.rotation.y = side * 0.29;
                    state.shipGroup.add(hinge);
                });

                [-1, 1].forEach(side => {
                    // Trapezoidal main wings (clipped tips, forward-swept trailing edge)
                    addPlanform(mirrorPts([[0.9,-1.4],[3.6,1.3],[3.6,2.1],[0.9,2.9]], side),
                                0.09, hullMat, 0, edgeCol);
                    // Horizontal stabilators
                    addPlanform(mirrorPts([[0.9,2.7],[2.6,3.7],[2.6,4.2],[0.9,4.1]], side),

        function createEngineParticles() {
            // Deterministic Fix: Properly dispose of geometry and material to prevent memory leaks
            if (state.engineParticles) {
                state.shipGroup.remove(state.engineParticles);
                if (state.engineParticles.geometry) state.engineParticles.geometry.dispose();
                if (state.engineParticles.material) state.engineParticles.material.dispose();
            }
            
            // One lane of particles per nozzle so the exhaust leaves the real engines
            const random = createSeededRandom(state.shipSeed + 999);
            const layout = state.engineLayout || [[0, 0, 2.5]];
            const perEngine = 55;
            const particleCount = perEngine * layout.length;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const zStart = new Float32Array(particleCount);

            for (let e = 0; e < layout.length; e++) {
                const [ex, ey, ez] = layout[e];
                for (let k = 0; k < perEngine; k++) {
                    const i = e * perEngine + k;
                    positions[i * 3] = ex + (random() - 0.5) * 0.28;
                    positions[i * 3 + 1] = ey + (random() - 0.5) * 0.28;
                    positions[i * 3 + 2] = ez + random() * 3.2;
                    zStart[i] = ez;
                }
            }
            geo.userData.zStart = zStart;
            
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const mat = new THREE.PointsMaterial({
                color: state.engineColor,
                size: 0.22,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            state.engineParticles = new THREE.Points(geo, mat);
            state.shipGroup.add(state.engineParticles);
        }

                }, 300);
            });

            openConfigBtn.addEventListener('click', () => {
                openConfigBtn.classList.add('hidden');
                configPanel.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
            });

            document.getElementById('toggle-ui-btn').addEventListener('click', () => {
                const hud = document.getElementById('main-hud-wrapper');
                const icon = document.getElementById('toggle-ui-icon');
                state.uiVisible = !state.uiVisible;
                
                if (state.uiVisible) {
                    hud.classList.remove('opacity-0', 'pointer-events-none');
                    hud.classList.add('opacity-100');
                    icon.className = 'fa-solid fa-eye-slash text-lg';
                    if (configPanel.classList.contains('scale-0')) {
                        openConfigBtn.classList.remove('hidden');
                    }
                } else {
                    hud.classList.remove('opacity-100');
                    hud.classList.add('opacity-0', 'pointer-events-none'); 
                    icon.className = 'fa-solid fa-eye text-lg text-amber-400';
                    openConfigBtn.classList.add('hidden'); 
                }
            });

            document.querySelectorAll('.ship-select-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.currentTarget.getAttribute('data-ship'));
                    state.activeShipIndex = index;

                    document.querySelectorAll('.ship-select-btn').forEach(b => {
                        b.className = "ship-select-btn px-2 py-2 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 hover:text-cyan-300 text-[10px] font-orbitron font-bold truncate transition-all";
                    });
                    e.currentTarget.className = "ship-select-btn px-2 py-2 rounded-lg bg-cyan-950 border-2 border-cyan-400 text-cyan-300 text-[10px] font-orbitron font-bold truncate transition-all shadow-neon-cyan";

                    renderSelectedShipModel(index);
                    showToast(`Craft Switch: ${['F-22 RAPTOR','SU-57 FELON','PHANTOM GT-02','SOLARIS FX-47','VOID WING B-9'][index] || ('MODEL #' + (index + 1))}`);
                });
            });

            document.querySelectorAll('.engine-color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const hexStr = e.currentTarget.getAttribute('data-color');
                    state.engineColor = parseInt(hexStr);
                    if (state.thrusterMaterial) state.thrusterMaterial.color.setHex(state.engineColor);
                    if (state.engineParticles) state.engineParticles.material.color.setHex(state.engineColor);
                    
                    document.querySelectorAll('.engine-color-btn').forEach(b => {
                        b.classList.remove('border-2', 'border-cyan-400');
                        b.classList.add('border-slate-700');
                    });
                    e.currentTarget.classList.remove('border-slate-700');
                    e.currentTarget.classList.add('border-2', 'border-cyan-400');
                    showToast("Thruster Energy Adjusted");
                });
            });

            document.querySelectorAll('.sector-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const sectorKey = e.currentTarget.getAttribute('data-sector');
                    state.sector = sectorKey;
                    const config = SECTOR_CONFIGS[sectorKey];
                    
                    document.querySelectorAll('.sector-btn').forEach(b => {
                        b.className = "sector-btn w-full py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-600 text-[11px]";
                    });
                    e.currentTarget.className = "sector-btn w-full py-1.5 rounded-lg bg-cyan-950 text-cyan-300 border border-cyan-400 text-[11px] font-bold";
                    
                    rebuildEnvironmentForSector();
                    renderSelectedShipModel(state.activeShipIndex);
                    updateOnChainUI();

                    document.getElementById('hud-sector-name').innerText = config.name;
                    showToast(`MAPPED: ${config.name}`);
                });
            });

            document.getElementById('cam-preset-orbit').addEventListener('click', () => animateCameraTo(0, 3, 13));
            document.getElementById('cam-preset-engine').addEventListener('click', () => animateCameraTo(0, 1.5, 6)); 
            document.getElementById('cam-preset-cockpit').addEventListener('click', () => animateCameraTo(0, 1.0, -2.5));

            document.getElementById('hyperdrive-btn').addEventListener('click', () => {
                if (state.isWormholeActive || state.isWarping || state.warpQueued) return;
                const fire = () => {
                    state.warpQueued = false;
                    if (!state.isWormholeActive && !state.isWarping) state.timeSinceLastWarp = state.warpCycleDuration - 12;
                };
                if (state.audioEnabled && music.mode !== 'none') {
                    // Lock the jump to the next bar line (max ~2 s) so it lands on the music
                    state.warpQueued = true;
                    showToast('Warp locked to next bar');
                    setTimeout(fire, (1 - music.barPos) * MUSIC_BAR * 1000);
                } else {
                    fire();
                }
            });

            document.getElementById('toggle-orbit-btn').addEventListener('click', () => {
                state.autoRotate = !state.autoRotate;
                controls.autoRotate = state.autoRotate;
                document.getElementById('orbit-status-text').innerText = `AUTO: ${state.autoRotate ? 'ON' : 'OFF'}`;
            });

            document.getElementById('snapshot-btn').addEventListener('click', () => {
                renderer.render(scene, camera);
                const link = document.createElement('a');
                link.download = `spacecraft-nft-model-${state.activeShipIndex + 1}.png`;
                link.href = renderer.domElement.toDataURL('image/png');
                link.click();
                showToast("Viewport Captured!");
            });

            const modal = document.getElementById('metadata-modal');
            const closeModalFn = () => modal.classList.add('hidden');
            
            document.getElementById('info-modal-open-btn').addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('info-modal-close-btn').addEventListener('click', closeModalFn);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModalFn();
            });

            document.getElementById('modal-connect-btn').addEventListener('click', () => {
                const addr = document.getElementById('input-contract-address').value;
                const tokenId = document.getElementById('input-token-id').value;
                fetchSmartContractData(addr, tokenId);
                closeModalFn();
            });

            document.getElementById('audio-toggle-btn').addEventListener('click', toggleAudioHum);
        }

        function animateCameraTo(offsetX, offsetY, offsetZ) {
            if (state.cameraAnimFrame) cancelAnimationFrame(state.cameraAnimFrame);
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(offsetX, offsetY, offsetZ);
            
            let progress = 0;
            function step() {
                progress = Math.min(progress + 0.045, 1);
                const eased = progress * progress * (3 - 2 * progress);
                
                camera.position.lerpVectors(startPos, endPos, eased);
                controls.target.set(0,0,0);
                controls.update();
                
                if (progress < 1) {
                    state.cameraAnimFrame = requestAnimationFrame(step);
                } else {
                    state.cameraAnimFrame = null;
                }
            }
            step();
        }

        function showToast(text) {
            const toast = document.getElementById('toast-notification');
            const toastText = document.getElementById('toast-text');
            if (!toast || !toastText) return;

            toastText.innerText = text;
            toast.classList.remove('translate-x-full', 'opacity-0');

            if (state.toastTimeout) clearTimeout(state.toastTimeout);
            state.toastTimeout = setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 2800);
        }

        // ========================================================
        // SOUNDTRACK: gapless loop (Web Audio) + beat clock @ 115 BPM, 4/4
        // ========================================================
        const SOUNDTRACK_ID = 'Dc6goSHMFWJK5VWLRriLrrUbwXw5BHrrRtRSYbJRUGr3';
        const SOUNDTRACK_URLS = [
            'https://gateway.irys.xyz/' + SOUNDTRACK_ID,
            'https://arweave.net/' + SOUNDTRACK_ID
        ];
        const MUSIC_BPM = 115;
        const MUSIC_BEAT = 60 / MUSIC_BPM;   // ~0.5217 s
        const MUSIC_BAR = MUSIC_BEAT * 4;    // ~2.087 s
        const music = {
            mode: 'none',   // 'webaudio' | 'element' | 'none'
            ctx: null, buffer: null, source: null, gain: null, analyser: null, data: null,
            startedAt: 0, el: null, loading: false,
            pulse: 0, energy: 0, beatPhase: 0, barPos: 0
        };

        async function loadSoundtrack() {
            if (music.ctx) {
                for (const url of SOUNDTRACK_URLS) {
                    try {
                        const res = await fetch(url, { mode: 'cors' });
                        if (!res.ok) continue;
                        const arr = await res.arrayBuffer();
                        music.buffer = await new Promise((ok, fail) => music.ctx.decodeAudioData(arr, ok, fail));
                        music.mode = 'webaudio';
                        return;
                    } catch (err) {
                        console.warn('Soundtrack source failed:', url, err);
                    }
                }
            }
            // Fallback: plain HTML5 audio (loop may have a tiny gap, no spectrum analysis)
            music.el = new Audio(SOUNDTRACK_URLS[0]);
            music.el.loop = true;
            music.el.volume = 0.6;
            music.el.addEventListener('error', () => {
                if (music.el && music.el.src !== SOUNDTRACK_URLS[1]) music.el.src = SOUNDTRACK_URLS[1];
            }, { once: true });
            music.mode = 'element';
        }

        function startWebAudioLoop() {
            const src = music.ctx.createBufferSource();
            src.buffer = music.buffer;
            src.loop = true;
            music.gain = music.ctx.createGain();
            music.gain.gain.value = 0.6;
            music.analyser = music.ctx.createAnalyser();
            music.analyser.fftSize = 256;
            music.analyser.smoothingTimeConstant = 0.8;
            music.data = new Uint8Array(music.analyser.frequencyBinCount);
            src.connect(music.analyser);
            music.analyser.connect(music.gain);
            music.gain.connect(music.ctx.destination);
            music.startedAt = music.ctx.currentTime;
            src.start(0);
            music.source = src;
        }

        async function toggleAudioHum() {
            // Switch off: suspend keeps the beat clock and loop position intact
            if (state.audioEnabled) {
                if (music.mode === 'webaudio' && music.ctx) music.ctx.suspend();
                if (music.mode === 'element' && music.el) music.el.pause();
                state.audioEnabled = false;
                document.getElementById('audio-icon').className = 'fa-solid fa-volume-xmark';
                return;
            }
            if (music.loading) return;

            // Create + resume the context synchronously inside the tap (browser autoplay rules)
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC && !music.ctx) { try { music.ctx = new AC(); } catch (e) { music.ctx = null; } }
            if (music.ctx) { try { music.ctx.resume(); } catch (e) {} }

            if (music.mode === 'none') {
                music.loading = true;
                showToast('Loading Soundtrack...');
                try { await loadSoundtrack(); } finally { music.loading = false; }
            }

            try {
                if (music.mode === 'webaudio') {
                    if (!music.source) startWebAudioLoop(); else await music.ctx.resume();
                } else if (music.mode === 'element') {
                    await music.el.play();
                } else {
                    throw new Error('No soundtrack source');
                }
                state.audioEnabled = true;
                document.getElementById('audio-icon').className = 'fa-solid fa-volume-high text-cyan-400';
                showToast('Soundtrack Online');
            } catch (err) {
                console.error('Audio playback error:', err);
                showToast('ERROR: Audio Playback Blocked');
            }
        }

        // Per-frame beat clock + loudness. pulse: 1 on the beat -> 0; energy: smoothed low/mid level
        function updateMusic(delta) {
            let t = null;
            if (state.audioEnabled) {
                if (music.mode === 'webaudio' && music.ctx) {
                    t = music.ctx.currentTime - music.startedAt - (music.ctx.outputLatency || music.ctx.baseLatency || 0);
                } else if (music.mode === 'element' && music.el) {
                    t = music.el.currentTime;
                }
            }
            if (t === null || t < 0) {
                music.pulse *= Math.exp(-delta * 6);
                music.energy *= Math.exp(-delta * 4);
                return;
            }
            music.beatPhase = (t / MUSIC_BEAT) % 1;
            music.barPos = (t % MUSIC_BAR) / MUSIC_BAR;
            music.pulse = Math.pow(1 - music.beatPhase, 3);
            if (music.analyser && music.data) {
                music.analyser.getByteFrequencyData(music.data);
                let sum = 0;
                const n = 24;
                for (let i = 0; i < n; i++) sum += music.data[i];
                const level = sum / (n * 255);
                music.energy += (level - music.energy) * Math.min(1, delta * 8);
            } else {
                music.energy = 0.25 + 0.35 * music.pulse;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            frameCounter++;
            const now = performance.now();
            if (now - lastFpsTimestamp >= 1000) {
                const currentFps = Math.round((frameCounter * 1000) / (now - lastFpsTimestamp));
                const fpsElem = document.getElementById('fps-counter');
                if (fpsElem) fpsElem.innerText = currentFps;
                frameCounter = 0;
                lastFpsTimestamp = now;
            }

            if (state.starMaterial) {
                state.starMaterial.uniforms.time.value = elapsedTime;
            }

            // --- Music reactivity (all values decay to 0 when the soundtrack is off) ---
            updateMusic(delta);
            const beatPulse = music.pulse;
            const beatEnergy = music.energy;
            if (state.starMaterial) state.starMaterial.uniforms.beat.value = beatPulse;
            renderer.toneMappingExposure = 1.25 + 0.14 * beatPulse + 0.10 * beatEnergy;
            if (state.thrusterMaterial) state.thrusterMaterial.opacity = 0.78 + 0.22 * Math.max(beatPulse, beatEnergy);
            if (state.engineParticles) state.engineParticles.material.size = 0.22 + 0.09 * beatPulse;
            if (state.shipGroup) {
                const halo = state.shipGroup.userData.sovereignHalo;
                if (halo) {
                    halo.rotation.y += delta * 0.4;
                    halo.scale.setScalar(1 + 0.025 * beatPulse);
                }
                const coins = state.shipGroup.userData.coinOrbit;
                if (coins) coins.rotation.y += delta * 0.35;
                const shards = state.shipGroup.userData.crystalOrbit;
                if (shards) { shards.rotation.y -= delta * 0.6; shards.children.forEach((c, i) => { c.rotation.y += delta * (1 + i * 0.15); }); }
                const core = state.shipGroup.userData.coreCrystal;
                if (core) { core.rotation.y += delta * 1.2; core.scale.y = 1.5 + 0.12 * Math.sin(elapsedTime * 3) + 0.25 * beatPulse; }
            }

            if (state.shipGroup) {
                state.shipGroup.position.y = Math.sin(elapsedTime * 1.4) * 0.18;
                state.shipGroup.rotation.z = Math.sin(elapsedTime * 0.9) * 0.04;
                state.shipGroup.rotation.x = Math.cos(elapsedTime * 0.7) * 0.03;

                if (state.engineParticles) {
                    const posAttr = state.engineParticles.geometry.attributes.position;
                    const speedMultiplier = state.isWormholeActive ? 5.0 : 3.0;
                    const zStartArr = state.engineParticles.geometry.userData.zStart;
                    for (let i = 0; i < posAttr.count; i++) {
                        let z = posAttr.getZ(i);
                        z += delta * 8.0 * speedMultiplier;
                        if (z > zStartArr[i] + 3.2) z = zStartArr[i];
                        posAttr.setZ(i, z);
                    }
                    posAttr.needsUpdate = true;
                }
            }

            const pSpeed = state.isWormholeActive ? 240 : 25;

            if (state.stardustField) {
                const pos = state.stardustField.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    let z = pos.getZ(i) + delta * pSpeed;
                    if (z > 40) z = -200;
                    pos.setZ(i, z);
                }
                pos.needsUpdate = true;
            }

            if (state.squareParticlesField) {
                const pos = state.squareParticlesField.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    let z = pos.getZ(i) + delta * (pSpeed * 1.3);
                    if (z > 50) z = -220;
                    pos.setZ(i, z);
                }
                pos.needsUpdate = true;
            }

            state.celestialGroups.forEach((planet) => {
                planet.rotation.y += delta * (planet.userData.spinSpeed || 0.005);
            });

            if (state.instancedAsteroids && state.asteroidData) {
                let matrixUpdated = false;
                const dummy = new THREE.Object3D();
                const astSpeed = state.isWormholeActive ? 160 : 30;

                for (let i = 0; i < state.asteroidData.length; i++) {
                    const ast = state.asteroidData[i];
                    
                    ast.pos.z += delta * (astSpeed * 0.8 + ast.moveSpeedZ);
                    ast.rot.x += ast.rotSpeedX;
                    ast.rot.y += ast.rotSpeedY;
                    
                    if (ast.pos.z > 50) {
                        // Deterministic Fix: Use seeded randomizer instead of Math.random()
                        ast.pos.z = -200 - state.animRandom() * 150;
                        ast.pos.x = (state.animRandom() - 0.5) * 120;
                        ast.pos.y = (state.animRandom() - 0.5) * 80;
                    }
                    
                    dummy.position.copy(ast.pos);
                    dummy.rotation.copy(ast.rot);
                    dummy.scale.copy(ast.scale);
                    dummy.updateMatrix();

                    state.instancedAsteroids.setMatrixAt(i, dummy.matrix);
                    matrixUpdated = true;
                }
                if (matrixUpdated) state.instancedAsteroids.instanceMatrix.needsUpdate = true;
            }

            if (!state.isWarping) {
                state.timeSinceLastWarp += delta;
            }

            const anomalyAlert = document.getElementById('hud-anomaly-alert');
            const velocityHud = document.getElementById('hud-velocity-state');

            if (state.timeSinceLastWarp >= state.warpCycleDuration - 12 && !state.isWormholeActive) {
                state.isWormholeActive = true;
                if (anomalyAlert) anomalyAlert.classList.remove('hidden');
                
                if (state.wireframeGateway) {
                    state.wireframeGateway.position.set(0, 0, -600);
                    state.wireframeGateway.children[0].material.opacity = 0.95;
                    state.wireframeGateway.children[1].material.opacity = 0.9;
                }
                if (state.dimensionCore) state.dimensionCore.position.set(0, 0, -800);
                if (state.wormholeFront) state.wormholeFront.position.set(0, 0, -800);
                if (state.wormholeBack) state.wormholeBack.position.set(0, 0, -800);
                
                showToast("ANOMALY DETECTED: WORMHOLE");
            }

            if (state.isWormholeActive) {
                const rushSpeed = 160 + (180 * Math.max(0, (state.timeSinceLastWarp - (state.warpCycleDuration - 10))));
                
                if (state.wireframeGateway) {
                    state.wireframeGateway.position.z += delta * rushSpeed;
                    state.wireframeGateway.rotation.z += delta * 0.5;
                    
                    if (state.wireframeGateway.position.z > -150) {
                        if (velocityHud) {
                            velocityHud.innerText = 'QUANTUM SLIPSTREAM';
                            velocityHud.className = 'text-fuchsia-400 font-extrabold animate-pulse';
                        }
                        if (state.slipstreamRays) {
                            state.slipstreamRays.material.opacity = Math.min(0.85, state.slipstreamRays.material.opacity + delta * 2.0);
                            state.slipstreamRays.rotation.z += delta * 1.5;
                        }
                        state.slipstreamRings.forEach((ring, idx) => {
                            ring.material.opacity = Math.min(0.9, ring.material.opacity + delta * 2.0);
                            ring.position.z += delta * (rushSpeed * 0.9);
                            if (ring.position.z > 20) ring.position.z = -300;
                            const hueShift = (elapsedTime * 0.5 + idx * 0.1) % 1.0;
                            ring.material.color.setHSL(hueShift, 1.0, 0.6);
                        });
                    }
                }
                
                if (state.dimensionCore) {
                    state.dimensionCore.position.z += delta * rushSpeed;
                    state.dimensionCore.material.opacity = Math.min(1.0, state.dimensionCore.material.opacity + delta * 0.4);
                }
                
                if (state.wormholeFront && state.wormholeBack) {
                    state.wormholeFront.position.z += delta * rushSpeed;
                    state.wormholeBack.position.z += delta * rushSpeed;
                    state.wormholeFront.rotation.z -= delta * 3.0;
                    state.wormholeBack.rotation.z += delta * 3.0;
                    
                    state.wormholeFront.children.forEach(ring => {
                        ring.material.opacity = Math.min(0.8, ring.material.opacity + delta * 0.5);
                        ring.scale.setScalar(1.0 + (state.dimensionCore.position.z + 800) * 0.0015);
                    });
                    state.wormholeBack.children.forEach(ring => {
                        ring.material.opacity = Math.min(0.8, ring.material.opacity + delta * 0.5);
                        ring.scale.setScalar(1.0 + (state.dimensionCore.position.z + 800) * 0.0015);
                    });
                }

                if (state.dimensionCore && state.dimensionCore.position.z > -300) {
                    camera.fov = Math.min(140, camera.fov + delta * 70);
                    camera.updateProjectionMatrix();
                }

                if (state.dimensionCore && state.dimensionCore.position.z >= camera.position.z - 2 && !state.isWarping) {
                    state.isWarping = true;
                    const flash = document.getElementById('warp-flash');
                    if (flash) {
                        flash.className = "fixed inset-0 z-[60] pointer-events-none opacity-100 transition-opacity duration-300 bg-black";
                    }
                    
                    setTimeout(() => {
                        if (state.dimensionCore) state.dimensionCore.position.set(0, 0, 3000);
                        if (state.wormholeFront) state.wormholeFront.position.set(0, 0, 3000);
                        if (state.wormholeBack) state.wormholeBack.position.set(0, 0, 3000);
                        
                        if (state.wireframeGateway) {
                            state.wireframeGateway.position.set(0, 0, 3000);
                            state.wireframeGateway.children[0].material.opacity = 0;
                            state.wireframeGateway.children[1].material.opacity = 0;
                        }
                        if (state.slipstreamRays) state.slipstreamRays.material.opacity = 0;
                        state.slipstreamRings.forEach(r => r.material.opacity = 0);
                        if (state.dimensionCore) state.dimensionCore.material.opacity = 0;
                        if (state.wormholeFront) state.wormholeFront.children.forEach(r => r.material.opacity = 0);
                        if (state.wormholeBack) state.wormholeBack.children.forEach(r => r.material.opacity = 0);
                        
                        state.isWormholeActive = false;
                        state.timeSinceLastWarp = 0;
                        
                        if (anomalyAlert) anomalyAlert.classList.add('hidden');
                        if (velocityHud) {
                            velocityHud.innerText = 'CRUISING';
                            velocityHud.className = 'text-cyan-300';
                        }
                        
                        resetUniversePositions();
                        
                        camera.fov = state.baseFov;
                        camera.updateProjectionMatrix();
                        
                        if (flash) {
                            flash.className = "fixed inset-0 z-[60] pointer-events-none opacity-0 transition-opacity duration-[1000ms] bg-black";
                        }
                        
                        setTimeout(() => {
                            state.isWarping = false;
                        }, 1000);
                    }, 350);
                }
            }

            if (controls) {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        initWebGL();
        (function lockAndSync() {
            const idEl = document.getElementById('input-token-id');
            const adEl = document.getElementById('input-contract-address');
            if (idEl) { idEl.value = String(LOCKED_TOKEN_ID); idEl.readOnly = true; }
            if (adEl) adEl.readOnly = true;
            state.activeShipIndex = LOCKED_SHIP_INDEX;
            renderSelectedShipModel(LOCKED_SHIP_INDEX);
            fetchSmartContractData(adEl ? adEl.value : '', String(LOCKED_TOKEN_ID));
        })();
    </script>
