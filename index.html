<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRYS BATCH UPLOADER (333 ASSETS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
    <script src="./irys-bundle.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #050505; color: #e5e5e5; }
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen p-8 flex flex-col items-center">

    <div class="max-w-3xl w-full bg-[#111] border border-stone-800 rounded-xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold text-amber-500 mb-2">⚡ IRYS 333 BATCH UPLOADER</h1>
        <p class="text-xs text-stone-400 mb-6 border-b border-stone-800 pb-4">เครื่องมืออัปโหลด 1 โฟลเดอร์ (ไฟล์ 1.png ถึง 333.png)</p>

        <!-- STEP 1: Connect Wallet -->
        <div class="mb-6 bg-black p-4 rounded border border-stone-800">
            <h2 class="text-sm font-bold text-emerald-400 mb-3">STEP 1: CONNECT WALLET (BASE MAINNET)</h2>
            <button id="btnConnect" onclick="connectWallet()" class="bg-stone-800 hover:bg-stone-700 text-white px-6 py-2 rounded text-sm font-bold transition-colors">
                CONNECT WALLET
            </button>
            <p id="walletStatus" class="mt-2 text-xs text-stone-500">Status: Disconnected</p>
        </div>

        <!-- STEP 2: Select Folder -->
        <div class="mb-6 bg-black p-4 rounded border border-stone-800">
            <h2 class="text-sm font-bold text-emerald-400 mb-3">STEP 2: SELECT FOLDER</h2>
            <label class="block w-full border-2 border-dashed border-stone-700 hover:border-amber-500 p-8 text-center cursor-pointer transition-colors rounded">
                <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" onchange="handleFolderSelect(event)">
                <span class="text-3xl block mb-2">📁</span>
                <span class="text-sm text-stone-300 font-bold block">เลือกโฟลเดอร์ที่มีไฟล์ 1.png ถึง 333.png</span>
            </label>
            <div class="mt-4 flex justify-between text-xs">
                <span id="fileCount" class="text-amber-500 font-bold">0 / 333 FILES</span>
                <span id="fileSize" class="text-stone-400">0.00 MB</span>
            </div>
        </div>

        <!-- STEP 3: Execute Upload -->
        <div class="mb-6 bg-black p-4 rounded border border-stone-800">
            <h2 class="text-sm font-bold text-emerald-400 mb-3">STEP 3: EXECUTE UPLOAD</h2>
            <button id="btnUpload" onclick="executeUpload()" disabled class="w-full bg-amber-700 hover:bg-amber-600 disabled:bg-stone-800 disabled:text-stone-600 text-white font-bold py-3 rounded text-sm transition-colors cursor-not-allowed">
                DEPLOY 333 ASSETS TO IRYS
            </button>
            <div class="mt-4">
                <div class="w-full bg-stone-900 rounded-full h-2">
                    <div id="progressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="text-right text-xs mt-1 text-emerald-400 font-bold" id="progressText">0%</div>
            </div>
        </div>

        <!-- RESULT SECTION: EXTRACTION OF FOLDER ID -->
        <div id="resultContainer" class="hidden mb-6 bg-emerald-950/40 p-5 rounded border border-emerald-600 space-y-4">
            <h2 class="text-sm font-bold text-emerald-400">🎉 UPLOAD SUCCESSFUL</h2>
            
            <div>
                <label class="block text-xs text-stone-300 font-bold mb-1">🔑 FOLDER ID (MANIFEST ID):</label>
                <input type="text" id="folderIdOutput" readonly class="w-full bg-black border border-emerald-500 p-2 text-sm font-mono text-amber-400 rounded outline-none select-all" onclick="this.select()">
            </div>

            <div>
                <label class="block text-xs text-stone-300 mb-1">🌐 FULL GATEWAY URL:</label>
                <input type="text" id="manifestOutput" readonly class="w-full bg-black border border-stone-700 p-2 text-xs text-emerald-300 rounded outline-none select-all" onclick="this.select()">
            </div>
        </div>

        <!-- SYSTEM LOG -->
        <div class="bg-black p-3 rounded border border-stone-800 h-40 overflow-y-auto log-box text-[10px] text-stone-400 space-y-1" id="logBox">
            <div>[SYSTEM] Ready...</div>
        </div>
    </div>

<script>
    let provider, signer, irys;
    let selectedFiles = [];

    function log(msg, color = "text-stone-400") {
        const box = document.getElementById("logBox");
        const div = document.createElement("div");
        div.className = color;
        div.textContent = `> ${msg}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function connectWallet() {
        try {
            if (!window.ethereum) throw new Error("No Web3 wallet detected");
            log("Connecting wallet...", "text-yellow-400");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            const address = await signer.getAddress();
            const network = await provider.getNetwork();
            
            if (network.chainId !== 8453n) {
                log("Switching to Base Mainnet...", "text-yellow-400 font-bold");
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x2105' }]
                    });
                } catch (err) {
                    throw new Error("Please switch network to Base Mainnet.");
                }
            }

            document.getElementById("walletStatus").textContent = `Connected: ${address}`;
            document.getElementById("walletStatus").className = "mt-2 text-xs text-emerald-500 font-bold";
            
            log("Initializing Irys...", "text-yellow-400");
            irys = await window.InitSovereignIrys(signer);
            log("Irys initialized successfully", "text-emerald-400");
        } catch (err) {
            log(`Wallet Error: ${err.message}`, "text-red-500");
        }
    }

    function handleFolderSelect(event) {
        const rawFiles = event.target.files;
        if (!rawFiles || rawFiles.length === 0) return;

        const validFiles = Array.from(rawFiles).filter(f => {
            return f.name.match(/^([1-9]|[1-9][0-9]|[1-2][0-9]{2}|3[0-2][0-9]|33[0-3])\.png$/i) !== null;
        }).sort((a, b) => parseInt(a.name) - parseInt(b.name));

        const mbSize = (validFiles.reduce((sum, f) => sum + f.size, 0) / 1024 / 1024).toFixed(2);
        document.getElementById("fileCount").textContent = `${validFiles.length} / 333 FILES`;
        document.getElementById("fileSize").textContent = `${mbSize} MB`;

        if (validFiles.length !== 333) {
            log(`พบไฟล์เพียง ${validFiles.length} รูป (ต้องการ 1.png ถึง 333.png ครบถ้วน)`, "text-red-500 font-bold");
            document.getElementById("btnUpload").disabled = true;
        } else {
            log(`พบไฟล์ครบ 333 รูป พร้อมอัปโหลด`, "text-emerald-400 font-bold");
            document.getElementById("btnUpload").disabled = false;
            document.getElementById("btnUpload").classList.remove("cursor-not-allowed");
        }
        selectedFiles = validFiles;
    }

    // ฟังก์ชันติดเกราะ ป้องกันการหลุดระหว่างทาง
    async function uploadWithRetry(file, maxRetries = 3) {
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            try {
                // สำหรับ Browser SDK ต้องแปลงเป็น ArrayBuffer เพื่อความเสถียรของ Memory เมื่อไฟล์มีจำนวนมาก
                const arrayBuffer = await file.arrayBuffer();
                const receipt = await irys.upload(arrayBuffer, { tags: [{ name: "Content-Type", value: "image/png" }] });
                return receipt;
            } catch (error) {
                if (attempt === maxRetries) throw error;
                log(`[RETRY] ขัดข้องที่ไฟล์ ${file.name} (รอบ ${attempt}/${maxRetries}) กำลังพยายามใหม่...`, "text-yellow-500 font-bold");
                await new Promise(r => setTimeout(r, 2000 * attempt));
            }
        }
    }

    async function executeUpload() {
        if (!irys || selectedFiles.length !== 333) return;

        const btn = document.getElementById("btnUpload");
        btn.disabled = true;
        btn.textContent = "PROCESSING...";

        try {
            const totalBytes = selectedFiles.reduce((acc, f) => acc + f.size, 0);
            const aggregateSize = totalBytes + 50000;

            const price = BigInt((await irys.getPrice(aggregateSize)).toString());
            const balance = BigInt((await irys.getLoadedBalance()).toString());

            if (balance < price) {
                const diffWithBuffer = ((price - balance) * 120n) / 100n;
                log(`Funding ${ethers.formatEther(diffWithBuffer)} ETH to Irys...`, "text-yellow-400");
                await irys.fund(diffWithBuffer.toString());
                
                let synced = false;
                for (let i = 0; i < 20; i++) {
                    await new Promise(r => setTimeout(r, 4000));
                    if (BigInt((await irys.getLoadedBalance()).toString()) >= price) { synced = true; break; }
                }
                if (!synced) throw new Error("Irys node sync timeout");
            }

            log("Uploading 333 assets...", "text-yellow-400");
            const paths = {};
            let completed = 0;
            const CONCURRENCY = 3; // ปรับลงเหลือ 3 เพื่อรักษาสมดุล Memory Browser

            for (let i = 0; i < selectedFiles.length; i += CONCURRENCY) {
                const chunk = selectedFiles.slice(i, i + CONCURRENCY);
                await Promise.all(chunk.map(async (file) => {
                    const receipt = await uploadWithRetry(file);
                    paths[file.name] = { id: receipt.id };
                    completed++;
                    const pct = (completed / 333) * 90;
                    document.getElementById("progressBar").style.width = `${pct}%`;
                    document.getElementById("progressText").textContent = `${Math.round(pct)}%`;
                }));
            }

            log("Generating Folder Manifest...", "text-yellow-400");
            const manifestPayload = JSON.stringify({ manifest: "arweave/paths", version: "0.1.0", index: { path: "1.png" }, paths });
            const manifestBlob = new Blob([manifestPayload], { type: "application/json" });
            const manifestBuffer = await manifestBlob.arrayBuffer();
            
            const manifestReceipt = await irys.upload(manifestBuffer, {
                tags: [{ name: "Content-Type", value: "application/x.arweave-manifest+json" }]
            });

            document.getElementById("progressBar").style.width = `100%`;
            document.getElementById("progressText").textContent = `100%`;

            const folderId = manifestReceipt.id;
            const manifestUrl = `https://gateway.irys.xyz/${folderId}/`;

            log(`SUCCESS! Folder ID: ${folderId}`, "text-emerald-500 font-bold");

            document.getElementById("resultContainer").classList.remove("hidden");
            document.getElementById("folderIdOutput").value = folderId;
            document.getElementById("manifestOutput").value = manifestUrl;

        } catch (err) {
            log(`ERROR: ${err.message}`, "text-red-500 font-bold");
        } finally {
            btn.textContent = "DEPLOY 333 ASSETS TO IRYS";
            btn.disabled = false;
        }
    }

</script>
</body>
</html>
